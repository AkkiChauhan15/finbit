<body class="bg-background text-on-background h-full flex flex-col items-center justify-center font-sans antialiased px-margin-mobile">
<div class="w-full max-w-[375px] mx-auto bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0_4px_6px_-1px_rgba(15,23,42,0.05)] p-5 flex flex-col gap-5">
<div class="flex flex-col items-center text-center gap-2 pt-2 pb-4">
<span class="material-symbols-outlined text-primary text-[48px]" data-icon="savings">savings</span>

</div>

<div class="hidden bg-error-container text-on-error-container p-3 rounded-lg flex items-start gap-2 border border-error/20" id="error-alert">
<span class="material-symbols-outlined text-error text-[20px] mt-0.5" data-icon="error">error</span>
<span class="font-body-sm text-body-sm">Invalid email or password. Please try again.</span>
</div>
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="mail">mail</span>
<input class="w-full h-11 pl-10 pr-3 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none transition-shadow" id="email" placeholder="you@example.com" type="email">
</div>
</div>
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-11 pl-10 pr-10 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none transition-shadow" id="password" placeholder="••••••••" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<button class="w-full h-11 mt-2 bg-primary-container text-on-primary rounded-md font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary transition-colors shadow-[0_2px_4px_rgba(15,23,42,0.06)]" onclick="simulateLogin(this)" type="button">
                Sign In
            </button>
</form>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-on-surface-variant">or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full h-11 bg-surface-container-lowest border border-outline-variant text-on-surface rounded-md font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors shadow-sm" type="button">

            Google
        </button>
<p class="text-center font-body-sm text-body-sm text-on-surface mt-2">
            Don't have an account? <a class="font-label-md text-label-md text-primary hover:underline" href="#">Register</a>
</p>
</div>
<script>
        function simulateLogin(btn) {
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Signing in...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            setTimeout(() => {
                btn.innerHTML = 'Sign In';
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                document.getElementById('error-alert').classList.remove('hidden');
            }, 1500);
        }
    </script>
