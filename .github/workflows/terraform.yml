name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "deploy/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "deploy/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        options: [plan, apply, destroy]
        default: plan

concurrency:
  group: terraform-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.13.4"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_domain_name: ${{ vars.APP_DOMAIN }}
  TF_VAR_mongo_uri: ${{ secrets.MONGO_URI }}

defaults:
  run:
    shell: bash
    working-directory: terraform

jobs:
  validate:
    name: Format & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    if: vars.TF_STATE_BUCKET != ''
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=finbit/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        run: |
          mode=""
          if [ "${{ inputs.action }}" = "destroy" ]; then mode="-destroy"; fi
          terraform plan $mode -input=false -no-color -lock-timeout=5m | tee plan.txt
          {
            echo "### Terraform plan ${mode}"
            echo '```'
            grep -E '^(Plan:|No changes|Changes to Outputs)' plan.txt || tail -n 20 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: ${{ inputs.action == 'destroy' && 'Destroy' || 'Apply' }}
    needs: plan
    runs-on: ubuntu-latest
    if: >-
      vars.TF_STATE_BUCKET != '' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.action != 'plan'))
    # Add required reviewers to the "production" environment for a manual approval gate.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=finbit/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform apply
        if: inputs.action != 'destroy'
        run: |
          terraform apply -auto-approve -input=false -no-color -lock-timeout=5m
          {
            echo "### Deployment"
            echo "- App: $(terraform output -raw app_url)"
            echo "- API health: $(terraform output -raw api_health_url)"
            echo "- Instance: $(terraform output -raw instance_id)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false -no-color -lock-timeout=5m
