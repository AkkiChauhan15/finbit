name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-v1

      - name: Test with coverage
        run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries

      - name: Build client
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: server/coverage
          if-no-files-found: ignore

  forecast:
    name: Forecast service lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecast-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

  docker-build:
    name: Build Docker images
    needs: [node, forecast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: finbit-server:ci

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: finbit-client:ci

      - name: Build forecast image
        uses: docker/build-push-action@v6
        with:
          context: ./forecast-service
          file: forecast-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: finbit-forecast:ci

  security:
    name: Security scans
    needs: [node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build server image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          load: true
          push: false
          tags: finbit-server:ci

      - name: Trivy image scan (server)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: finbit-server:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build forecast image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./forecast-service
          file: forecast-service/Dockerfile
          load: true
          push: false
          tags: finbit-forecast:ci

      - name: Trivy image scan (forecast)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: finbit-forecast:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build client image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          load: true
          push: false
          tags: finbit-client:ci

      - name: Trivy image scan (client)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: finbit-client:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
