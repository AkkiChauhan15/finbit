# Production stack used on the EC2 host provisioned by Terraform (see terraform/).
# Terraform's user_data writes this file and a matching .env to /opt/finbit.
#
#   Caddy (TLS, :80/:443) -> client (nginx, SPA + /api proxy) -> server (Express) -> mongo

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ${SERVER_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/financial_habit_builder}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      COOKIE_SECURE: "true"
      CLIENT_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
    depends_on:
      mongo:
        condition: service_healthy

  client:
    image: ${CLIENT_IMAGE}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://server:5000
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
