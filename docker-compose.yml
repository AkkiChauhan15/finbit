services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Wired into the API rate limiter in a later phase.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  forecast:
    build:
      context: ./forecast-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FORECAST_API_KEY: ${FORECAST_API_KEY}
    # Internal-only: no host port published.
    expose:
      - "8001"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/finbit
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      COOKIE_SECURE: "false"
      FORECAST_SERVICE_URL: http://forecast:8001
      FORECAST_API_KEY: ${FORECAST_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      forecast:
        condition: service_started

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:
