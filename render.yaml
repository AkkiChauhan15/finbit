# Render blueprint for the Finbit API and forecast microservice.
#
# The React client is deployed separately through Vercel's Git integration on
# `main` (see client/vercel.json) and is not defined here.
#
# Both services use `runtime: docker` and `autoDeploy: false`: deploys only run
# through the CD pipeline (GitHub Actions posts the Render deploy hooks after CI
# passes and the images are pushed to GHCR). Images are tagged by short SHA.
#
# Rollback: in the Render dashboard, select the service and click "Rollback" to
# the previous deploy, or "Manual Deploy" an older commit SHA.

services:
  - type: web
    name: finbit-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: COOKIE_SECURE
        value: true
      - key: CLIENT_URL
        sync: false
      - key: FORECAST_SERVICE_URL
        sync: false
      - key: FORECAST_API_KEY
        fromService:
          type: web
          name: finbit-forecast
          envVarKey: FORECAST_API_KEY

  - type: web
    name: finbit-forecast
    runtime: docker
    plan: free
    dockerfilePath: ./forecast-service/Dockerfile
    dockerContext: ./forecast-service
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: FORECAST_API_KEY
        generateValue: true
