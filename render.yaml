services:
  - type: web
    name: financial-habit-builder-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --workspace server
    startCommand: npm start --workspace server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: COOKIE_SECURE
        value: true
      - key: CLIENT_URL
        sync: false
